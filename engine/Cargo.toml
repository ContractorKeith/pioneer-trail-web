[workspace]
resolver = "2"
members = ["crates/sim", "crates/data", "crates/web"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ContractorKeith/pioneer-trail-web"
authors = ["Keith Bloemendaal <keith@dutchbuiltnc.com>"]
readme = "README.md"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.8"
rand = "0.8"
rand_chacha = { version = "0.3", features = ["serde1"] }
thiserror = "1"
include_dir = "0.7"
proptest = "1"
