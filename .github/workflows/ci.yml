name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  browser_smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run gameplay smoke tests
        run: >-
          npm run test:e2e -- tests/survival.spec.ts tests/crossing-options.spec.ts
          tests/world.spec.ts tests/spatial-activity.spec.ts
          --project=${{ matrix.browser }}
          --grep 'landscape coarse-pointer controls$|at the riverbank$|collides, reboards and drives$|caught food and day exactly once$|day without a catch$|ordinary cold departure day$'
          --reporter=line,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: smoke-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-smoke-results-${{ matrix.browser }}
          path: |
            test-results/
            smoke-report.json

  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run lint
      - run: npm run test:types
      - run: npm test
      - run: npm run build
      - run: cargo test --manifest-path engine/Cargo.toml --locked
      - run: npm run test:engine
      - run: npm run test:assets
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:dev
        if: matrix.browser == 'chromium' && matrix.shard == 1
      - run: npm run test:e2e -- --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results-${{ matrix.browser }}-${{ matrix.shard }}
          path: test-results/
